name: vibe-relay
version: 0.5.0
description: >
  Vibecoding without burning your best model: quota-aware self vs cheap executor
  delegation, gate-bound acceptance, enforced stop-at-threshold with auto
  park/resume across usage-window resets, a night shift for large projects
  (hard stop, quota-checked continuation wakes, morning report from records),
  an Agent Workshop skill pack, and Scheme B — vendored DEV Framework plus the
  lean-orchestration deterministic gate (skipped when a standalone copy is enabled).
author: trenthalden
homepage: https://github.com/trenthalden/vibe-relay
requires_hermes: ">=0.22.5"
provides_tools:
  - vibe_accept
  - vibe_night_start
  - vibe_night_log
  - vibe_night_status
  - vibe_night_arm
  - vibe_night_report
  - df_init
  - df_check
  - df_nav
  - orch_gate
  - orch_dispatch
  - orch_accept
provides_hooks:
  - pre_llm_call
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - subagent_start
  - subagent_stop
  - on_session_start
