name: CI

on:
  push:
    branches: [main, 'feat/**', 'lane/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: vibe-relay
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.23.3
          path: hermes-agent
      - name: Prepare the Python toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then bootstrap=python; else bootstrap=python3; fi
          "$bootstrap" -S hermes-agent/scripts/ci/setup_toolchain.py prepare \
            --toolchain python --home hermes-agent/.build/pm
      - name: Prepare the locked Python toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then bootstrap=python; else bootstrap=python3; fi
          "$bootstrap" -S hermes-agent/scripts/ci/setup_toolchain.py install \
            --toolchain python --home hermes-agent/.build/pm
      # Hermes and its locked runtime are prepared separately from the plugin.
      # The validator runtime lives under the Hermes checkout, not the plugin.
      - name: Build the isolated validator runtime
        id: runtime
        shell: bash
        working-directory: hermes-agent
        run: |
          set -euo pipefail
          "$HERMES_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          from pm import build_environment
          source = Path.cwd()
          python = build_environment(source=source, out=source / ".build/validator", explicit=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"python={python}\n")
          PY
      - name: Test, validate and scan
        shell: bash
        env:
          VALIDATOR_PYTHON: ${{ steps.runtime.outputs.python }}
        run: '"$VALIDATOR_PYTHON" vibe-relay/.github/scripts/ci_check.py --plugin vibe-relay --hermes hermes-agent --workspace .'
